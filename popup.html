<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Paste</title>
    <style>
        :root {
            color-scheme: light;
            --bg-top: #eef7ff;
            --bg-bottom: #d7ecff;
            --panel: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(43, 109, 211, 0.14);
            --panel-shadow: 0 18px 45px rgba(29, 67, 128, 0.16);
            --text: #142033;
            --muted: #5f6f89;
            --accent: #1d73ff;
            --accent-strong: #1253cf;
            --accent-soft: #e6f0ff;
            --success: #0f8a5f;
            --error: #b44732;
            --surface: #f6faff;
            --line: #d9e7f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 400px;
            font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }

        .popup-shell {
            padding: 18px;
            display: grid;
            gap: 14px;
        }

        .hero {
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(145deg, #1c74ff, #10346c 82%);
            color: #fff;
            box-shadow: var(--panel-shadow);
        }

        .hero-head {
            display: block;
        }

        .hero h1,
        .section-copy h2 {
            margin: 0;
        }

        .hero h1 {
            font-size: 18px;
            line-height: 1.1;
        }

        .hero p {
            margin: 6px 0 0;
            font-size: 12px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.82);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(8px);
        }

        .section-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .section-copy h2 {
            font-size: 16px;
            line-height: 1.15;
        }

        .eyebrow {
            margin: 0 0 5px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .section-copy p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .hotkey-list {
            display: grid;
            gap: 12px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .hotkey-entry {
            display: grid;
            gap: 10px;
            padding: 14px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff, #f6fbff);
            border: 1px solid var(--line);
        }

        .entry-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .entry-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .hotkey,
        .textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
        }

        .hotkey {
            min-height: 42px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        .textarea {
            min-height: 84px;
            padding: 11px 12px;
            resize: vertical;
            line-height: 1.45;
        }

        .hotkey:focus,
        .textarea:focus {
            outline: none;
            border-color: rgba(29, 115, 255, 0.55);
            box-shadow: 0 0 0 4px rgba(29, 115, 255, 0.14);
            background: #fff;
        }

        .button,
        .remove {
            border: none;
            font: inherit;
            cursor: pointer;
            transition: transform 140ms ease, opacity 140ms ease, background 140ms ease;
        }

        .button:hover,
        .remove:hover {
            transform: translateY(-1px);
        }

        .button {
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .button-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            box-shadow: 0 12px 24px rgba(18, 83, 207, 0.22);
        }

        .button-secondary {
            color: var(--accent-strong);
            background: var(--accent-soft);
        }

        .button-ghost {
            color: var(--text);
            background: #edf4fb;
        }

        .button-row,
        .footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer-row {
            margin-top: 12px;
        }

        .remove {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #edf4fb;
            color: #5d6d86;
            font-size: 20px;
            line-height: 1;
        }

        .empty-state {
            margin: 4px 0 0;
            padding: 18px 16px;
            border: 1px dashed #bdd2ef;
            border-radius: 16px;
            background: rgba(246, 250, 255, 0.88);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .status {
            margin: 0;
            min-height: 18px;
            font-size: 12px;
            color: var(--muted);
        }

        .status[data-tone="success"] {
            color: var(--success);
        }

        .status[data-tone="error"] {
            color: var(--error);
        }
    </style>
    <script src="popup.js" defer></script>
</head>
<body>
    <main class="popup-shell">
        <section class="hero">
            <div class="hero-head">
                <div>
                    <h1>Super Paste</h1>
                    <p>Paste snippets with shortcuts.</p>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="section-bar">
                <div class="section-copy">
                    <p class="eyebrow">Snippet Library</p>
                    <h2>Your shortcuts</h2>
                    <p>Save frequently used text.</p>
                </div>
                <button id="add-hotkey" class="button button-secondary" type="button">Add Snippet</button>
            </div>

            <div id="hotkey-container" class="hotkey-list"></div>
            <div id="empty-state" class="empty-state" hidden>
                Add your first snippet to start pasting repeated text with a shortcut.
            </div>

            <div class="footer-row">
                <p id="save-status" class="status" aria-live="polite"></p>
                <button id="save" class="button button-primary" type="button">Save Changes</button>
            </div>
        </section>

        <section class="panel">
            <div class="section-bar">
                <div class="section-copy">
                    <p class="eyebrow">Backup</p>
                    <h2>Move your setup</h2>
                    <p>Export or import your snippets.</p>
                </div>
            </div>

            <div class="button-row">
                <button id="export-config" class="button button-secondary" type="button">Export Config</button>
                <input type="file" id="import-config" accept="application/json" hidden />
                <button id="import-config-btn" class="button button-ghost" type="button">Import Config</button>
            </div>
        </section>
    </main>
</body>
</html>
